server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Wbudowany DNS Dockera. Bez tego nginx rozwiazuje nazwe kontenera API
    # raz przy starcie i trzyma ten adres IP na stale. Gdy kontener API
    # zostanie odtworzony (wdrozenie, zmiana konfiguracji), dostaje nowy
    # adres, a nginx dalej puka pod stary i kazde zadanie do API konczy sie
    # bledem 502 — mimo ze API dziala poprawnie.
    #
    # Uzycie zmiennej w proxy_pass wymusza rozwiazanie nazwy przy kazdym
    # zadaniu. Zmienna zmienia tez semantyke proxy_pass: nginx przestaje
    # doklejac sciezke automatycznie, dlatego trzeba podac $request_uri.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Statyki SPA — fallback do index.html dla routingu klienta.
    # index.html NIGDY nie jest cache'owany (hashowane assety robią cache-busting).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Nazwy plikow w /assets/ zawieraja odcisk tresci, wiec sa niezmienne.
    # Bez jawnego naglowka przegladarka stosuje heurystyke i potrafi trzymac
    # zapamietana odpowiedz godzinami bez odpytania serwera. Wlasnie dlatego
    # bledny typ MIME przetrwal poprawke na serwerze, a twarde odswiezenie nic
    # nie dawalo: worker PDF pobierany jest dopiero po kliknieciu podgladu,
    # czyli poza przeladowaniem, ktore pomija pamiec.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Wbudowana lista typow nginx nie zna rozszerzenia .mjs i podaje takie pliki
    # jako application/octet-stream. Przegladarka odmawia wtedy wykonania modulu
    # ES, przez co psul sie podglad PDF — pdf.js laduje swojego workera wlasnie
    # z pliku .mjs ("Setting up fake worker failed").
    #
    # Pusty blok types tylko dla tej lokalizacji: deklaracja types w kontekscie
    # server ZASTAPILABY cala odziedziczona liste i zepsula typy CSS oraz obrazow.
    #
    # Naglowek Cache-Control trzeba powtorzyc: lokalizacja z wyrazeniem
    # regularnym ma pierwszenstwo przed prefiksem /assets/, a add_header nie
    # jest dziedziczone, gdy biezacy poziom ma wlasne dyrektywy add_header.
    location ~ \.mjs$ {
        types { }
        default_type text/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # REST API → chat-api
    location /api/ {
        set $chat_api http://wb-chat-api:4000;
        proxy_pass $chat_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # socket.io (ścieżka /ws) → chat-api, z upgradem do WebSocket
    location /ws {
        set $chat_api_ws http://wb-chat-api:4000;
        proxy_pass $chat_api_ws$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
